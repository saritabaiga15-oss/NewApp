spring:
  datasource:
    # Direct Supabase or Transaction Pooler connection string
    # Supabase direct: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
    # Supabase pooler: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:db.your-project.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:your-supabase-db-password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SupabaseHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
