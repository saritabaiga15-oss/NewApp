# ==============================================================================
# Honour Your Mentor - onodemBackend (Spring Boot)
# Main Application Configuration
# ==============================================================================

# Spring Application
spring.application.name=onodemBackend
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:neon}

# JPA
spring.jpa.open-in-view=false

# Multipart File Uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
spring.servlet.multipart.file-size-threshold=2MB

# Automated Emails
spring.mail.host=${MAIL_HOST:smtpout.secureserver.net}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:info@onodem.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Embedded Tomcat Web Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Storage, Domain & Mail Configuration
app.domain=${APP_DOMAIN:onodem.com}
app.mail.from=${APP_MAIL_FROM:info@onodem.com}
app.mail.from-name=${APP_MAIL_FROM_NAME:Honour Your Mentor}
app.mail.app-url=${APP_WEB_URL:https://onodem.com}
app.mail.enabled=${MAIL_ENABLED:true}
app.storage.upload-dir=${UPLOAD_DIR:uploads/media}
app.storage.base-url=${BASE_MEDIA_URL:https://onodem.com/api/v1/media/files}

# JWT Authentication
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000

# CORS Allowed Origins
# Browser origins allowed to call the API. Any localhost port works during development.
app.cors.allowed-origins=https://onodem.com,https://www.onodem.com,http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*

# OpenAPI 3 / Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

