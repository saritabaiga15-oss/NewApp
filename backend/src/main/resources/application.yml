spring:
  application:
    name: onodemBackend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:neon}
  jpa:
    # CRITICAL FOR FILE & MEDIA UPLOADS:
    # Release database connection immediately after transaction completes.
    # Prevents holding DB connections during long HTTP file streaming or multi-part uploads!
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB          # Supports high-res photos, audio notes, and scanned letters
      max-request-size: 30MB
      file-size-threshold: 2MB     # Files < 2MB stay in RAM; larger stream to disk buffer without JVM heap bloat
  mail:
    host: ${MAIL_HOST:smtpout.secureserver.net} # Default GoDaddy SMTP or custom host
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:info@onodem.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

# Storage, Domain & JWT Configuration
app:
  domain: ${APP_DOMAIN:onodem.com}
  mail:
    from: ${APP_MAIL_FROM:info@onodem.com}
    from-name: ${APP_MAIL_FROM_NAME:Honour Your Mentor}
    app-url: ${APP_WEB_URL:https://onodem.com}
    enabled: ${MAIL_ENABLED:true}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads/media}
    base-url: ${BASE_MEDIA_URL:https://api.onodem.com/api/v1/media/files}
  jwt:
    # 256-bit base64/hex secret key (MUST be provided via env in production)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 86400000      # 24 hours
    refresh-token-expiration-ms: 604800000    # 7 days
  cors:
    allowed-origins:
      - "https://onodem.com"
      - "https://www.onodem.com"
      - "https://api.onodem.com"
      - "http://localhost:8081"
      - "http://localhost:19006"
      - "http://localhost:3000"
      - "http://127.0.0.1:8081"
      - "http://10.0.2.2:8081"

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: ${SWAGGER_ENABLED:true}
