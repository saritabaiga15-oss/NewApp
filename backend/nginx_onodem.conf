# ==============================================================================
# Nginx Configuration for onodem.com and api.onodem.com
# Routes traffic from onodem.com -> Spring Boot backend (port 8080)
# ==============================================================================

# 1. API Subdomain: https://api.onodem.com -> Spring Boot Backend
server {
    listen 80;
    listen [::]:80;
    server_name api.onodem.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.onodem.com;

    # SSL Certificates (e.g. Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/onodem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onodem.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Forwarded Headers for Spring Security & Host preservation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for live notifications if enabled)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 2. Main Domain: https://onodem.com -> React / Expo Web or Proxy
server {
    listen 80;
    listen [::]:80;
    server_name onodem.com www.onodem.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onodem.com www.onodem.com;

    ssl_certificate /etc/letsencrypt/live/onodem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onodem.com/privkey.pem;

    # If backend also serves /api on the main domain:
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger Documentation
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Static Web App (e.g. dist/ from expo export:web)
    location / {
        root /var/www/onodem/web-build;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

