# ==============================================================================
# High-Performance Nginx Configuration for onodem.com and api.onodem.com
# Features:
#   - Gzip compression (~80% bandwidth & load time reduction)
#   - Long-term immutable caching for hashed static assets
#   - 50MB client upload limit for pictures, voice notes & letters
#   - Fast reverse-proxying with keepalive connections
# ==============================================================================

# 1. HTTP -> HTTPS Redirect for All Domains
server {
    listen 80;
    listen [::]:80;
    server_name onodem.com www.onodem.com api.onodem.com;
    return 301 https://$host$request_uri;
}

# 2. API Subdomain (Optional direct access): https://api.onodem.com -> Spring Boot
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.onodem.com;

    ssl_certificate /etc/letsencrypt/live/onodem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onodem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 3. Main Domain: https://onodem.com and https://www.onodem.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onodem.com www.onodem.com;

    ssl_certificate /etc/letsencrypt/live/onodem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onodem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload limit for pictures, audio notes, and scanned letters
    client_max_body_size 50M;

    # ── High-Speed GZIP Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ── Same-Origin API Proxy (/api/ -> Spring Boot Backend) ────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Swagger UI Documentation ───────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Hashed Static Assets: 1-Year Immutable Browser Caching ─────────────
    # Files in _expo/ and assets/ contain SHA content hashes and never change
    location ~* ^/(_expo|assets)/.*\.(?:css|js|woff2?|ttf|png|jpe?g|gif|ico|svg|webp)$ {
        root /var/www/onodem/web-build;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── HTML Pages: Non-cached so website updates apply immediately ─────────
    location ~* \.html$ {
        root /var/www/onodem/web-build;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ── Root SPA Fallback (Expo Web Export) ──────────────────────────────────
    location / {
        root /var/www/onodem/web-build;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
